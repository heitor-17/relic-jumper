<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
<!-- Placa de madeira na terra com caveira vermelha pintada -->
<g fill="#111"><rect x="2" y="2" width="12" height="9"/><rect x="6" y="8" width="4" height="8"/></g>
<!-- poste -->
<rect x="7" y="9" width="2" height="6" fill="#6d4c41"/>
<rect x="8" y="9" width="1" height="6" fill="#4e342e"/>
<!-- placa -->
<rect x="3" y="3" width="10" height="7" fill="#a9744f"/>
<rect x="3" y="6" width="10" height="1" fill="#8b5e3c"/>
<rect x="3" y="8" width="10" height="1" fill="#8b5e3c"/>
<!-- caveira vermelha -->
<rect x="6" y="4" width="4" height="3" fill="#d32f2f"/>
<rect x="7" y="7" width="2" height="1" fill="#d32f2f"/>
<rect x="6" y="5" width="1" height="1" fill="#111"/>
<rect x="9" y="5" width="1" height="1" fill="#111"/>
</svg>
