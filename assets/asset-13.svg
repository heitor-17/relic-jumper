<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 12" shape-rendering="crispEdges">
<!-- Plataforma retangular de madeira envelhecida com cordas nas pontas -->
<rect x="0" y="1" width="32" height="10" fill="#111"/>
<rect x="1" y="2" width="30" height="8" fill="#a9744f"/>
<rect x="1" y="2" width="30" height="1" fill="#c89b6e"/>
<rect x="1" y="9" width="30" height="1" fill="#6d4c41"/>
<!-- divisões das tábuas -->
<rect x="7" y="2" width="1" height="8" fill="#6d4c41"/>
<rect x="15" y="2" width="1" height="8" fill="#6d4c41"/>
<rect x="23" y="2" width="1" height="8" fill="#6d4c41"/>
<!-- nós e rachaduras -->
<rect x="4" y="5" width="1" height="2" fill="#8b5e3c"/>
<rect x="11" y="7" width="2" height="1" fill="#8b5e3c"/>
<rect x="19" y="4" width="1" height="2" fill="#8b5e3c"/>
<rect x="26" y="6" width="2" height="1" fill="#8b5e3c"/>
<!-- corda amarrada na ponta esquerda -->
<rect x="2" y="4" width="3" height="3" fill="#c8a165"/>
<rect x="2" y="4" width="1" height="1" fill="#8b6b3f"/>
<rect x="4" y="4" width="1" height="1" fill="#8b6b3f"/>
<rect x="2" y="6" width="1" height="1" fill="#8b6b3f"/>
<rect x="4" y="6" width="1" height="1" fill="#8b6b3f"/>
<!-- corda amarrada na ponta direita -->
<rect x="27" y="4" width="3" height="3" fill="#c8a165"/>
<rect x="27" y="4" width="1" height="1" fill="#8b6b3f"/>
<rect x="29" y="4" width="1" height="1" fill="#8b6b3f"/>
<rect x="27" y="6" width="1" height="1" fill="#8b6b3f"/>
<rect x="29" y="6" width="1" height="1" fill="#8b6b3f"/>
</svg>
