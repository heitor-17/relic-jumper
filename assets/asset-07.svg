<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">
<!-- Explorador balançando chicote marrom esticado para a frente -->
<g fill="#111"><rect x="1" y="0" width="12" height="10"/><rect x="4" y="6" width="20" height="11"/><rect x="1" y="10" width="5" height="9"/><rect x="0" y="15" width="16" height="9"/></g>
<rect x="4" y="1" width="7" height="3" fill="#7b4a2d"/>
<rect x="4" y="3" width="7" height="1" fill="#3e2415"/>
<rect x="2" y="4" width="11" height="2" fill="#6b3f23"/>
<rect x="5" y="6" width="6" height="3" fill="#f2c9a0"/>
<rect x="9" y="7" width="1" height="1" fill="#111"/>
<!-- torso inclinado -->
<rect x="5" y="9" width="8" height="7" fill="#4e342e"/>
<rect x="9" y="9" width="1" height="7" fill="#2f1b12"/>
<!-- braço estendido segurando o chicote -->
<rect x="10" y="10" width="4" height="3" fill="#5d4037"/>
<rect x="13" y="9" width="2" height="3" fill="#f2c9a0"/>
<!-- chicote esticado -->
<rect x="15" y="9" width="6" height="2" fill="#6b3f23"/>
<rect x="21" y="7" width="2" height="3" fill="#5a341d"/>
<!-- braço de trás para equilíbrio -->
<rect x="2" y="11" width="3" height="5" fill="#5d4037"/>
<rect x="2" y="16" width="3" height="2" fill="#f2c9a0"/>
<!-- pernas em avanço -->
<rect x="8" y="16" width="4" height="3" fill="#37474f"/>
<rect x="9" y="18" width="4" height="2" fill="#37474f"/>
<rect x="10" y="20" width="5" height="3" fill="#3e2723"/>
<rect x="3" y="16" width="3" height="3" fill="#37474f"/>
<rect x="1" y="17" width="3" height="2" fill="#37474f"/>
<rect x="1" y="19" width="4" height="3" fill="#3e2723"/>
</svg>
