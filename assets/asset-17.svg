<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
<!-- Caixote de madeira quadrado reforçado com pregos nas pontas -->
<rect x="0" y="0" width="16" height="16" fill="#111"/>
<rect x="2" y="2" width="12" height="12" fill="#a9744f"/>
<!-- moldura de tábuas -->
<rect x="2" y="2" width="12" height="2" fill="#8b5e3c"/>
<rect x="2" y="12" width="12" height="2" fill="#8b5e3c"/>
<rect x="2" y="4" width="2" height="8" fill="#8b5e3c"/>
<rect x="12" y="4" width="2" height="8" fill="#8b5e3c"/>
<!-- painel interno -->
<rect x="4" y="4" width="8" height="8" fill="#a9744f"/>
<rect x="5" y="6" width="4" height="1" fill="#8b5e3c"/>
<rect x="6" y="9" width="3" height="1" fill="#8b5e3c"/>
<!-- placas de reforço nas pontas -->
<rect x="2" y="2" width="3" height="3" fill="#6d4c41"/>
<rect x="11" y="2" width="3" height="3" fill="#6d4c41"/>
<rect x="2" y="11" width="3" height="3" fill="#6d4c41"/>
<rect x="11" y="11" width="3" height="3" fill="#6d4c41"/>
<!-- pregos -->
<rect x="3" y="3" width="1" height="1" fill="#d7ccc8"/>
<rect x="12" y="3" width="1" height="1" fill="#d7ccc8"/>
<rect x="3" y="12" width="1" height="1" fill="#d7ccc8"/>
<rect x="12" y="12" width="1" height="1" fill="#d7ccc8"/>
</svg>
