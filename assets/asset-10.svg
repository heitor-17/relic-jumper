<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16" shape-rendering="crispEdges">
<!-- Explorador caído de barriga para cima, chapéu ao lado -->
<g fill="#111"><rect x="1" y="4" width="6" height="5"/><rect x="6" y="2" width="10" height="8"/><rect x="14" y="3" width="8" height="8"/><rect x="5" y="9" width="10" height="6"/></g>
<!-- cabeça deitada -->
<rect x="2" y="5" width="4" height="3" fill="#f2c9a0"/>
<rect x="3" y="6" width="1" height="1" fill="#111"/>
<rect x="5" y="6" width="1" height="1" fill="#111"/>
<!-- corpo deitado -->
<rect x="7" y="5" width="8" height="4" fill="#4e342e"/>
<rect x="7" y="6" width="8" height="1" fill="#2f1b12"/>
<!-- braço para o lado -->
<rect x="9" y="3" width="4" height="2" fill="#5d4037"/>
<rect x="13" y="3" width="2" height="2" fill="#f2c9a0"/>
<!-- pernas esticadas -->
<rect x="15" y="5" width="4" height="2" fill="#37474f"/>
<rect x="15" y="8" width="4" height="2" fill="#37474f"/>
<rect x="19" y="4" width="3" height="2" fill="#3e2723"/>
<rect x="19" y="8" width="3" height="2" fill="#3e2723"/>
<!-- chapéu caído ao lado -->
<rect x="8" y="10" width="5" height="2" fill="#7b4a2d"/>
<rect x="8" y="11" width="5" height="1" fill="#3e2415"/>
<rect x="6" y="12" width="8" height="2" fill="#6b3f23"/>
</svg>
