<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 24" shape-rendering="crispEdges">
<!-- Explorador de frente segurando troféu dourado acima da cabeça -->
<g fill="#111"><rect x="2" y="0" width="11" height="8"/><rect x="1" y="6" width="14" height="12"/><rect x="3" y="16" width="9" height="8"/></g>
<!-- troféu -->
<rect x="5" y="1" width="6" height="3" fill="#ffc107"/>
<rect x="3" y="1" width="2" height="2" fill="#ff8f00"/>
<rect x="11" y="1" width="2" height="2" fill="#ff8f00"/>
<rect x="7" y="4" width="2" height="1" fill="#ff8f00"/>
<rect x="6" y="5" width="4" height="1" fill="#ffc107"/>
<!-- braços erguidos -->
<rect x="3" y="7" width="2" height="10" fill="#5d4037"/>
<rect x="11" y="7" width="2" height="10" fill="#5d4037"/>
<!-- mãos segurando o troféu -->
<rect x="3" y="5" width="2" height="2" fill="#f2c9a0"/>
<rect x="11" y="5" width="2" height="2" fill="#f2c9a0"/>
<!-- chapéu fedora (de frente) -->
<rect x="4" y="11" width="8" height="3" fill="#7b4a2d"/>
<rect x="4" y="13" width="8" height="1" fill="#3e2415"/>
<rect x="2" y="14" width="12" height="1" fill="#6b3f23"/>
<!-- rosto de frente -->
<rect x="5" y="15" width="6" height="2" fill="#f2c9a0"/>
<rect x="6" y="15" width="1" height="1" fill="#111"/>
<rect x="9" y="15" width="1" height="1" fill="#111"/>
<!-- jaqueta -->
<rect x="4" y="17" width="8" height="4" fill="#4e342e"/>
<rect x="8" y="17" width="1" height="4" fill="#2f1b12"/>
<!-- pernas -->
<rect x="5" y="21" width="3" height="2" fill="#37474f"/>
<rect x="8" y="21" width="3" height="2" fill="#37474f"/>
</svg>
