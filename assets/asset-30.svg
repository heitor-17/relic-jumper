<rect x="10" y="3" width="2" height="11" fill="#ffc107"/>
<rect x="5" y="8" width="1" height="6" fill="#ff8f00"/>
<rect x="10" y="8" width="1" height="6" fill="#ff8f00"/>
<!-- placa da fechadura -->
<rect x="6" y="7" width="4" height="4" fill="#ffc107"/>
<rect x="7" y="8" width="2" height="1" fill="#111"/>
<rect x="7" y="9" width="1" height="1" fill="#111"/>
