<rect x="4" y="3" width="8" height="2" fill="#a9744f"/>
<rect x="2" y="5" width="12" height="3" fill="#a9744f"/>
<rect x="2" y="8" width="12" height="6" fill="#8b5e3c"/>
<rect x="2" y="11" width="12" height="1" fill="#6d4c41"/>
<!-- ferragens douradas -->
