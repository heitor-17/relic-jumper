<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 24" shape-rendering="crispEdges">
<!-- Painel grande de madeira clara com cantoneiras de ferro escuro -->
<rect x="0" y="0" width="32" height="24" fill="#111"/>
<rect x="1" y="1" width="30" height="22" fill="#d7b98e"/>
<!-- tábuas -->
<rect x="1" y="6" width="30" height="1" fill="#c5a678"/>
<rect x="1" y="12" width="30" height="1" fill="#c5a678"/>
<rect x="1" y="18" width="30" height="1" fill="#c5a678"/>
<!-- cantoneiras de ferro -->
<g fill="#37474f">
<rect x="1" y="1" width="6" height="2"/><rect x="1" y="1" width="2" height="6"/>
<rect x="25" y="1" width="6" height="2"/><rect x="29" y="1" width="2" height="6"/>
<rect x="1" y="21" width="6" height="2"/><rect x="1" y="17" width="2" height="6"/>
<rect x="25" y="21" width="6" height="2"/><rect x="29" y="17" width="2" height="6"/>
</g>
<!-- rebites -->
<g fill="#90a4ae">
<rect x="3" y="3" width="1" height="1"/><rect x="28" y="3" width="1" height="1"/>
<rect x="3" y="20" width="1" height="1"/><rect x="28" y="20" width="1" height="1"/>
</g>
</svg>
