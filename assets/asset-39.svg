<rect x="4" y="3" width="3" height="2"/><rect x="12" y="9" width="4" height="2"/>
<rect x="20" y="4" width="3" height="2"/><rect x="30" y="8" width="4" height="2"/>
<rect x="40" y="3" width="3" height="2"/>
</g>
<!-- interior oco escuro -->
<rect x="3" y="4" width="42" height="8" fill="#1a2229"/>
<rect x="3" y="4" width="42" height="1" fill="#0f151b"/>
